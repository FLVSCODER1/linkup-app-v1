name: Sync beta lockfile

on:
  push:
    branches:
      - agent/v0.7.0-beta.6-event-visibility

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.7.0-beta.6-event-visibility

      - name: Update lockfile release version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.7.0-beta.6';
          if (lock.packages && lock.packages['']) {
            lock.packages[''].version = '0.7.0-beta.6';
          }
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "v0.7.0-beta.6: sync package lock"
          git push origin HEAD:agent/v0.7.0-beta.6-event-visibility
